<!DOCTYPE html>
<html>

<head>
  <title>AugRe (Marker-based)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- import jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"
    integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"
    integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU=" crossorigin="anonymous"></script>
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <!-- we import arjs version without NFT but with marker + location based support -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="./fileLoad.jQuery.js"></script>
  <script src="./gesture-detector.js"></script>
  <script src="./gesture-handler.js"></script>
  <script src="./positionButtonSet.js"></script>
  <script src="./fatNav/jquery.fatNav.min.js"></script>
  <script src="./fatNav.Init.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="./fatNav/jquery.fatNav.min.css">
  <link rel="stylesheet" href="./fatNav.Init.css">
</head>

<body style="margin : 0px; overflow: hidden;">
  <div class="fat-nav">
    <div class="fat-nav__wrapper">
      <!-- Card 1: Load Model -->
      <div class="ui-widget-content ui-corner-all">
        <div style="display: none;">
          <input type="file" id="fileInput" class="fileInput" accept=".glb">
        </div>
        <button class="fileInputButton fat-navButton ui-button ui-widget ui-corner-all">
          <i class="material-icons">folder_open</i> Load .GLB
        </button>
      </div>

      <!-- Card 2: Help -->
      <div class="ui-widget-content ui-corner-all">
        <p><span class="material-icons">info</span> 1 finger: rotate<br>Pinch: grow/shrink</p>
      </div>

      <!-- Card 3: Controls -->
      <div class="ui-widget-content ui-corner-all">
        <div id="positionButtonSet">
          <button class="fat-navButton ui-button ui-widget ui-corner-all positionButton" value="-0.1">
            <span class="ui-icon ui-icon-minus"></span> Near
          </button>
          <button class="fat-navButton ui-button ui-widget ui-corner-all positionButton" value="0.1">
            <span class="ui-icon ui-icon-plus"></span> Far
          </button>
        </div>
      </div>
    </div>
  </div>
  <a-scene embedded
    arjs='sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3_PARITY65; labelingMode: white_region'
    vr-mode-ui="enabled: false" gesture-detector id="scene">
    <a-marker type="barcode" value="8" raycaster="objects: .clickable" emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;">
      <a-entity id="entity" position="0 0 0" scale="1 1 1" gltf-model="glb/question.glb" class="clickable"
        gesture-handler="minScale: 0.01; maxScale: 10"></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>

</html>
