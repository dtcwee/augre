<!DOCTYPE html>
<html>

<head>
  <title>AugRe (Model-Viewer Based)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- import jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
    integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="https://code.jquery.com/ui/1.14.0/jquery-ui.min.js"
    integrity="sha256-Eb0oR5BSMoBpJPdRvwUFK74P93v07XG3xV2O78O6c/I=" crossorigin="anonymous"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <script src="./js/fileLoad.jQuery.js"></script>
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.0/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body style="padding: 10px;">
    <div class="ui-widget-content ui-corner-all">
        <input type="file" id="fileInput" class="fileInput" accept=".glb, .GLB" style="display: none;">
        <button class="fileInputButton fat-navButton ui-button ui-widget ui-corner-all">
            <i class="material-icons">folder_open</i> Load .GLB
        </button>
    </div>
    <div class="ui-widget-content ui-corner-all">
      <model-viewer id="viewer" src="glb/question.glb" ar ar-modes="webxr scene-viewer quick-look" camera-controls tone-mapping="neutral" poster="assets/poster.webp" shadow-intensity="1" style="width: 100%; height: 400px;">
      </model-viewer>
    </div>
    <div class="ui-widget-content ui-corner-all">
        AR mode compatible with <a href="https://modelviewer.dev/examples/augmentedreality/">Google AR Core</a> and <a href="https://developer.apple.com/augmented-reality/quick-look/">Apple AR Quick Look</a>.
    </div>
</body>

</html>
